<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:home' %}">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="/contacts/">Контакты</a>
        {% if user.is_authenticated %}
        <!-- Кнопки для авторизованного пользователя -->
        <a class="p-2 btn btn-outline-info" href="{% url 'users:profile' %}">Профиль</a>

        <form action="{% url 'users:logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="p-2 btn btn-outline-danger">Выход</button>
        </form>
        {% else %}
        <!-- Кнопки для анонима -->
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Вход</a>
        <a class="p-2 btn btn-primary text-white" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </nav>
</div>
