{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>{% if object %}Редактировать статью{% else %}Новая статья{% endif %}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="card p-4">
            {{ form.as_p }}
            <div class="mt-3">
                <button type="submit" class="btn btn-success">
                    {% if object %}Сохранить изменения{% else %}Опубликовать{% endif %}
                </button>
                <a href="{% url 'blog:list' %}" class="btn btn-secondary">Отмена</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
