version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file: [ .env ]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    expose: [ "5432" ]
    volumes: [ pg_data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    expose: [ "6379" ]
    volumes: [ redis_data:/data ]

  web:
    build: .
    # Делаем миграции и запускаем дефолтную команду из Dockerfile (gunicorn)
    command: sh -c "python manage.py migrate && gunicorn --bind 0.0.0.0:8000 drf_project.wsgi:application"
    restart: always
    expose: [ "8000" ]
    env_file: [ .env ]
    volumes:
      - .:/app
      - static_volume:/app/static
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  celery:
    build: .
    command: celery -A celery_app:app worker --loglevel=info
    restart: always
    env_file: [ .env ]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  celery_beat:
    build: .
    command: celery -A celery_app:app beat --loglevel=info
    restart: always
    env_file: [ .env ]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/static
    depends_on:
      - web

volumes:
  pg_data:
  redis_data:
  static_volume:
