name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "homework_35_2" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      # Поднимаем временную тестовую базу данных внутри GitHub
      postgres_db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_drf_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        # Ждем, пока база полностью запустится
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Поднимаем временный Redis для тестов
      redis_broker:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Проверяем репозиторий и копируем код
        uses: actions/checkout@v4

      - name: Настраиваем Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Устанавливаем зависимости проекта
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запускаем тесты Django
        env:
          # Передаем тестовые переменные окружения
          SECRET_KEY: "test_secret_key_for_github_actions"
          DEBUG: "True"
          DB_NAME: "test_drf_db"
          DB_USER: "test_user"
          DB_PASSWORD: "test_password"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          CELERY_BROKER_URL: "redis://localhost:6379/0"
          CELERY_RESULT_BACKEND: "redis://localhost:6379/0"
        run: |
          python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Подключаемся по SSH и обновляем проект на сервере
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Переходим в папку с проектом на сервере 
            cd /var/www/drf_project
            
            # Стягиваем свежие коммиты из ветки домашки
            git pull origin homework_35_2
            
            # Пересобираем и перезапускаем Docker-контейнеры в фоновом режиме (-d)
            docker-compose down
            docker-compose up --build -d
            
            # Накатываем свежие миграции внутри контейнера web
            docker-compose exec -T web python manage.py migrate
            
            # Собираем статику заново (на всякий случай)
            docker-compose exec -T web python manage.py collectstatic --noinput
